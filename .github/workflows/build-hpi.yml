name: Build TestComplete HPI

on:
  workflow_dispatch:
  push:
    branches:
      - pr-32

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build plugin
        run: mvn --batch-mode clean package

      - name: Upload HPI
        uses: actions/upload-artifact@v4
        with:
          name: TestComplete-HPI
          path: target/*.hpi
          if-no-files-found: error
